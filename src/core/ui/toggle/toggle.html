<label class="setting toggle" for="<%= id %>">
  <span class="setting__text">
    <span class="setting__label"><%= label %></span>
    <span class="setting__hint" id="<%= id %>Hint"></span>
  </span>
  <input class="toggle__input" type="checkbox" role="switch" id="<%= id %>" aria-describedby="<%= id %>Hint" />
  <span class="toggle__track" aria-hidden="true"></span>
</label>
