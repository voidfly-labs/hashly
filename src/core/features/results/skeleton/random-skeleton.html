<% for (let i = 1; i <= 10; i++) { %>
<div class="random__item random__item--skeleton" data-skeleton style="--i: <%= i - 1 %>" aria-hidden="true">
  <span class="random__item-index"><%= String(i).padStart(2, '0') %></span>
  <span class="random__item-hash">&nbsp;<span class="skeleton__bar"></span></span>
  <span class="algo-badge random__item-badge skeleton__badge"><%= defaultAlgo %></span>
  <div class="random__item-actions">
    <span class="random__item-btn skeleton__btn">
      <svg class="icon-action" viewBox="0 0 24 24"><use href="/src/assets/images/icons.svg#icon-copy"></use></svg>
    </span>
    <span class="random__item-btn skeleton__btn">
      <svg class="icon-action" viewBox="0 0 24 24"><use href="/src/assets/images/icons.svg#icon-download"></use></svg>
    </span>
  </div>
</div>
<% } %>
