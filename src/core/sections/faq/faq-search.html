<div class="search-field" role="search">
  <svg class="search-field__icon" viewBox="0 0 24 24" aria-hidden="true">
    <use href="/src/assets/images/icons.svg#icon-search"></use>
  </svg>
  <input
    class="search-field__input"
    type="search"
    placeholder="Search questions and answers"
    data-placeholder-mobile="Search the FAQ"
    aria-label="Search the FAQ"
    autocomplete="off"
    autocapitalize="off"
    autocorrect="off"
    spellcheck="false"
    enterkeyhint="search" />
  <button class="search-field__clear" type="button" aria-label="Clear search" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <use href="/src/assets/images/icons.svg#icon-close"></use>
    </svg>
  </button>
  <span class="search-field__count" aria-live="polite"></span>
</div>
