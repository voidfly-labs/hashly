<!-- Says the drop had more files than the limit allows, see limit-notice.js. Shown at the top of the file list. -->
<div class="notice-bar limit-notice" id="fileLimitNotice" hidden>
  <svg class="notice-bar__icon" viewBox="0 0 24 24" aria-hidden="true">
    <use href="/src/assets/images/icons.svg#icon-warning"></use>
  </svg>
  <span class="limit-notice__text"></span>
  <button class="limit-notice__action" type="button">Raise limit</button>
</div>
