<!-- The undo offered in the text footer after text was cleared: an icon button (ui/icon-button/),
     shown by ./text-undo.js (./text-undo.css) -->
<div class="text-undo" id="textUndo" hidden>
  <button class="icon-btn icon-btn--flex" id="textUndoBtn" type="button" aria-label="Undo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><use href="/src/assets/images/icons.svg#icon-undo"></use></svg>
  </button>
</div>
