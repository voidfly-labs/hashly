<!-- The row under the text field: the counter, the notes, the undo (../undo/) and the floating hint
     (./text-footer.css, ../counter/, ./footer-focus.js) -->
<div class="text-footer">
  <div class="text-counter" id="textCounter">
    <span id="textCounterChars">0 chars</span>
    <span class="text-counter__sep" aria-hidden="true"></span>
    <span id="textCounterBytes">0 bytes</span>
  </div>
  <span class="hint text-footer__hint" id="textFormatHint" aria-live="polite">
    <svg class="hint__icon" viewBox="0 0 24 24" aria-hidden="true">
      <use href="/src/assets/images/icons.svg#icon-warning"></use>
    </svg>
    <span class="hint__text"></span>
  </span>
  <span class="counter-notes" id="textCounterNotes" aria-live="polite"></span>
  <%- include('/src/core/sections/text/undo/text-undo.html') %>
</div>
