<!-- Reference hash — judges the same-size result rows below, see core/components/verify.js -->
<div class="verify" id="fileVerify">
  <!-- Same chrome as the text input (card around an .input-wrap) so the focus ring renders identically -->
  <div class="card card--unclipped verify__field">
    <div class="input-wrap">
      <input
        class="verify__input"
        id="fileVerifyInput"
        type="text"
        placeholder="Paste a reference hash to verify (hex or Base64)…"
        data-placeholder-mobile="Paste a hash to verify (hex or Base64)…"
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        aria-label="Reference hash to compare the file against"
        aria-describedby="fileVerifyStatus" />
      <button class="verify__clear" aria-label="Clear reference hash" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="/src/assets/images/icons.svg#icon-close"></use></svg>
      </button>
      <button class="verify__paste" aria-label="Paste reference hash from clipboard" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="/src/assets/images/icons.svg#icon-paste"></use></svg>
      </button>
      <button class="verify__file" aria-label="Upload a file containing the reference hash" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <use href="/src/assets/images/icons.svg#icon-upload"></use>
        </svg>
      </button>
      <input class="verify__file-input" type="file" hidden tabindex="-1" aria-hidden="true" />
    </div>
  </div>
  <%- include('/src/templates/components/verify-status.html') %>
</div>
