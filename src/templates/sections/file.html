<!-- ── FILE ── -->
<section class="section" id="file" aria-labelledby="section-file-heading">
  <div class="section__label-row">
    <h2 class="section__label" id="section-file-heading">
      <svg class="section__label-icon" viewBox="0 0 24 24" aria-hidden="true">
        <use href="/src/assets/images/icons.svg#icon-docs"></use>
      </svg>
      File
      <svg class="section__label-arrow" viewBox="0 0 16 10" aria-hidden="true">
        <use href="/src/assets/images/icons.svg#icon-arrow-right"></use>
      </svg>
      <%= sectionNoun.charAt(0).toUpperCase() + sectionNoun.slice(1) %>
    </h2>
    <button class="toggle-all-btn" id="fileToggleAllBtn" aria-label="Deselect all file algorithms">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <use href="/src/assets/images/icons.svg#icon-checkbox-checked"></use>
      </svg>
    </button>
    <button
      class="history-btn"
      id="fileHistoryBtn"
      aria-label="Show file <%= sectionNoun %> history"
      aria-expanded="false"
      aria-controls="fileHistoryPopover">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="/src/assets/images/icons.svg#icon-history"></use></svg>
    </button>
    <div class="history-popover" id="fileHistoryPopover">
      <div class="history-popover__header">
        <span class="history-popover__title"
          >History – File <%= sectionNoun.charAt(0).toUpperCase() + sectionNoun.slice(1) %>s</span
        >
        <button class="history-popover__close" data-popover-close aria-label="Close history">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="/src/assets/images/icons.svg#icon-close"></use></svg>
        </button>
      </div>
      <div class="history-popover__body" id="fileHistoryBody"></div>
    </div>
  </div>

  <div class="card">
    <div class="card__body">
      <div class="file-drop" id="fileDrop">
        <input
          class="file-drop__input"
          type="file"
          id="fileInput"
          aria-label="Upload file for <%= sectionNoun %> calculation" />
        <button class="file-drop__clear" id="fileDropClear" aria-label="Remove selected file" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="/src/assets/images/icons.svg#icon-close"></use></svg>
        </button>
        <svg class="file-drop__icon" viewBox="0 0 24 24">
          <use href="/src/assets/images/icons.svg#icon-upload"></use>
        </svg>
        <div class="file-drop__text">Drop a file here or <strong>browse</strong></div>
        <div class="file-drop__filename" id="fileName">
          <span id="fileNameText" class="file-drop__filename-name"></span>
          <span class="file-drop__filesize" id="fileSize"></span>
        </div>
      </div>
    </div>

    <!-- Result rows — one per algorithm, rendered by FileSection.init() -->
    <div id="fileResults"></div>
  </div>

  <!-- Format options — output only, right-aligned -->
  <div class="options-row options-row--end" role="group" aria-label="Output format">
    <div class="options__group">
      <div class="options">
        <div class="options__segment">
          <span class="options__prefix">Output</span>
          <input class="options__radio" type="radio" name="fileFormat" id="fileFmt-hex" value="hex" checked />
          <label class="options__segment-label" for="fileFmt-hex">Hex</label>
          <input class="options__radio" type="radio" name="fileFormat" id="fileFmt-hex-upper" value="hex-upper" />
          <label class="options__segment-label" for="fileFmt-hex-upper">HEX</label>
          <input class="options__radio" type="radio" name="fileFormat" id="fileFmt-base64" value="base64" />
          <label class="options__segment-label" for="fileFmt-base64">Base64</label>
          <input class="options__radio" type="radio" name="fileFormat" id="fileFmt-binary" value="binary" />
          <label class="options__segment-label" for="fileFmt-binary">Binary</label>
        </div>
      </div>
    </div>
  </div>
</section>
