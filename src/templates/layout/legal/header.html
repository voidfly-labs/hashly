<!-- ========== HEADER ========== -->
<header class="header">
  <a class="header__brand" href="<%= brandUrl %>" aria-label="<%= siteName %> — go to homepage">
    <div class="header__logo-icon" aria-hidden="true">
      <img src="/src/assets/images/logo.svg" alt="<%= siteName %> logo" width="40" height="40" />
    </div>
    <span class="header__title"><%- brandTitleHtml %></span>
  </a>
  <div class="header__right">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle colour theme">
      <!-- Sun icon — shown in dark mode -->
      <svg class="theme-toggle__sun" viewBox="0 0 24 24"><use href="/src/assets/images/icons.svg#icon-sun"></use></svg>
      <!-- Moon icon — shown in light mode -->
      <svg class="theme-toggle__moon" viewBox="0 0 24 24">
        <use href="/src/assets/images/icons.svg#icon-moon"></use>
      </svg>
    </button>
  </div>
</header>
